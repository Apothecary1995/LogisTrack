name: Run Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  test-go-workers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Run export worker tests
        run: |
          cd workers/export_worker
          go mod tidy
          go test ./... -v

      - name: Run notification worker tests
        run: |
          cd workers/notification_worker
          go mod tidy
          go test ./... -v

      - name: Run couchdb worker tests
        run: |
          cd workers/couchdb_worker
          go mod tidy
          go test ./... -v

      - name: Run rate limiter tests
        run: |
          cd workers/rate_limiter
          go mod tidy
          go test ./... -v

      - name: Run pdf converter tests
        run: |
          cd workers/pdf_converter
          go mod tidy
          go test ./... -v

      - name: Run websocket server tests
        run: |
          cd workers/websocket_server
          go mod tidy
          go test ./... -v