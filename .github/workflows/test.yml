name: Run Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  test-go-workers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Run export worker tests
        run: |
          find . -name "go.mod" -type f
          cd workers/export_worker
          go mod tidy
          go test ./... -v