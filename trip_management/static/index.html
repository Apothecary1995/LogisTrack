<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sefer Oluşturma - Trip Management</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Sefer Oluşturma Formu</h1>
        <form id="trip-form">
            <label>
                Sefer Kodu
                <input type="text" name="tripCode" placeholder="TRIP123" required />
            </label>
            <label>
                Kalkış Yeri
                <input type="text" name="origin" placeholder="İstanbul" required />
            </label>
            <label>
                Varış Yeri
                <input type="text" name="destination" placeholder="Ankara" required />
            </label>
            <fieldset class="coords">
                <legend>Koordinatlar (opsiyonel)</legend>
                <label>
                    Kalkış Enlem
                    <input type="number" step="any" name="originLat" placeholder="41.01" />
                </label>
                <label>
                    Kalkış Boylam
                    <input type="number" step="any" name="originLng" placeholder="28.97" />
                </label>
                <label>
                    Varış Enlem
                    <input type="number" step="any" name="destLat" placeholder="39.92" />
                </label>
                <label>
                    Varış Boylam
                    <input type="number" step="any" name="destLng" placeholder="32.85" />
                </label>
            </fieldset>
            <label>
                Kalkış Tarihi & Saati
                <input type="datetime-local" name="departureTime" />
            </label>
            <label>
                Varış Tarihi & Saati
                <input type="datetime-local" name="arrivalTime" />
            </label>
            <label>
                Araç
                <input type="text" name="vehicle" placeholder="Plaka / Araç tipi" />
            </label>
            <label>
                Şoför
                <input type="text" name="driver" placeholder="Şoför adı" />
            </label>
            <label>
                Yük Türü
                <input type="text" name="cargo" placeholder="Yük açıklaması" />
            </label>
            <label>
                Notlar
                <textarea name="notes" placeholder="Ek bilgiler"></textarea>
            </label>
            <button type="submit">Sefer Oluştur</button>
        </form>

        <div id="message" class="message"></div>

        <h2>Oluşturulan Seferler</h2>
        <div id="trip-list" class="trip-list">
            <p>Henüz oluşturulmuş sefer yok.</p>
        </div>

        <h2>Arşivlenmiş Seferler</h2>
        <div id="archived-trip-list" class="trip-list">
            <p>Henüz arşivlenmiş sefer yok.</p>
        </div>

        <h2>Waybill Yönetimi</h2>
        <form id="waybill-form" class="waybill-form">
            <label>
                Waybill No
                <input type="text" name="waybillNumber" placeholder="WB-12345" required />
            </label>
            <label>
                Sefer Seçimi
                <select name="tripId" id="waybill-trip">
                    <option value="">Sefer seçin (opsiyonel)</option>
                </select>
            </label>
            <label>
                Gönderen
                <input type="text" name="sender" placeholder="Firma / kişi" />
            </label>
            <label>
                Alıcı
                <input type="text" name="receiver" placeholder="Firma / kişi" />
            </label>
            <label>
                Yük Açıklaması
                <input type="text" name="cargo" placeholder="Koli, palet, vs." />
            </label>
            <label>
                Ağırlık
                <input type="text" name="weight" placeholder="250 kg" />
            </label>
            <label>
                Hacim
                <input type="text" name="volume" placeholder="2 m³" />
            </label>
            <label>
                Alım Yeri
                <input type="text" name="pickup" placeholder="İstanbul deposu" />
            </label>
            <label>
                Teslim Yeri
                <input type="text" name="delivery" placeholder="Ankara şubesi" />
            </label>
            <label>
                Durum
                <select name="status">
                    <option value="Pending">Beklemede</option>
                    <option value="Loaded">Yüklendi</option>
                    <option value="InTransit">Yolda</option>
                    <option value="Delivered">Teslim Edildi</option>
                </select>
            </label>
            <button type="submit">Waybill Oluştur</button>
        </form>

        <h2>Waybill Listesi</h2>
        <div id="waybill-list" class="trip-list">
            <p>Henüz oluşturulmuş waybill yok.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
